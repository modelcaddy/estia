# Estia: a local LLM inference engine. Apache-2.0.
#
#   proto   estia-proto   runner protocol wire types (JSON lines)
#   engine  estia-engine  sessions, models, runtime, roles, structured output
#   llama   estia-llama   llama.cpp backend: runner adapter in front of llama-server
#   server  estia-server  HTTP API: OpenAI-compatible /v1/* and native /engine/*
#   cli     estia         the `estia` binary
#
# Applications embed `estia-engine` (and `estia-server` for the HTTP front) as
# ordinary dependencies. See README.md.
[workspace]
resolver = "2"
members = ["proto", "engine", "llama", "server", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.89: std::fs::File::lock. Dependencies alone need 1.88. CI checks this (the
# msrv job in .github/workflows/ci.yml).
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/modelcaddy/estia"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = "0.7"
tokio-stream = "0.1"
getrandom = "0.2"
sha2 = "0.10"
mdns-sd = "0.11"
