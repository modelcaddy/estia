name: Release

# Push a tag like v0.1.0 to publish a release. The tag must match the version
# in the workspace Cargo.toml, or the job stops before building.
#
# Artifacts: aarch64-apple-darwin only. MLX, the only backend today, needs
# Apple Silicon, so there is no Intel macOS build. There are no Linux or
# Windows artifacts yet: those platforms need the planned llama.cpp backend.
#
# The binary is not signed with a Developer ID or notarized. macOS blocks a
# quarantined download (one saved by a browser) until the quarantine attribute
# is removed; a download made with curl is not quarantined.
#
# The runner image is pinned (macos-15, Apple Silicon), never macos-latest, so
# it cannot change under a release. Move it to the next version before GitHub
# retires this one. MACOSX_DEPLOYMENT_TARGET states the oldest macOS the binary
# runs on; 11.0 is rustc's default for this target whatever the image's SDK.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-arm64:
    name: aarch64-apple-darwin
    runs-on: macos-15
    env:
      TARGET: aarch64-apple-darwin
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable

      # For THIRD_PARTY_LICENSES (see about.toml). A pinned prebuilt binary,
      # checked against the hash install-action records for it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Check the tag against the crate version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "estia") | .version')"
          if [ "$tag" != "$crate" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the estia crate version $crate." >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release --locked -p estia --target "$TARGET"

      # Layout inside the tarball:
      #   estia-<version>-aarch64-apple-darwin/
      #     estia
      #     runners/mlx-python/*.py
      #     LICENSE  NOTICE  README.md  THIRD_PARTY_LICENSES
      # The binary looks for runners/mlx-python/estia-runner.py beside itself
      # (find_runner in cli/src/main.rs), which is also the layout that
      # `estia service install` stages. THIRD_PARTY_LICENSES carries the
      # licence texts of the Rust crates linked into the binary.
      - name: Package
        id: package
        run: |
          set -euo pipefail
          name="estia-${{ steps.version.outputs.version }}-$TARGET"
          stage="dist/$name"
          mkdir -p "$stage/runners/mlx-python"
          cp "target/$TARGET/release/estia" "$stage/"
          cp runners/mlx-python/*.py "$stage/runners/mlx-python/"
          cp LICENSE NOTICE README.md "$stage/"
          bash .github/scripts/third-party-licenses.sh "$stage/THIRD_PARTY_LICENSES"
          # COPYFILE_DISABLE keeps macOS tar from adding ._ metadata files.
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Test the tarball that ships, not the staging directory. It is unpacked
      # outside the checkout and run from an unrelated directory with a fresh
      # data directory, so the only runner on disk is the one in the tarball.
      # If the tarball lost runners/, the binary would fall back to writing its
      # compiled-in copy under <data dir>/engine/runners/ and still report a
      # path ending in runners/mlx-python/estia-runner.py; so match the whole
      # line, with the unpacked directory's absolute path, and check that the
      # fallback wrote nothing.
      - name: Check the packaged binary finds its runner
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.package.outputs.name }}"
          (cd dist && shasum -a 256 -c "$name.tar.gz.sha256")
          smoke="$RUNNER_TEMP/estia-smoke"
          rm -rf "$smoke"
          mkdir -p "$smoke/unpack" "$smoke/cwd"
          tar -C "$smoke/unpack" -xzf "dist/$name.tar.gz"
          dir="$(cd "$smoke/unpack/$name" && pwd -P)"
          for f in estia runners/mlx-python/estia-runner.py LICENSE NOTICE README.md THIRD_PARTY_LICENSES; do
            test -s "$dir/$f" || { echo "missing from the tarball: $f" >&2; exit 1; }
          done
          data="$smoke/data"
          cd "$smoke/cwd"
          "$dir/estia" --version
          env -u ESTIA_RUNNER ESTIA_DATA_DIR="$data" "$dir/estia" status | tee "$smoke/status.txt"
          grep -qxF "runner   : $dir/runners/mlx-python/estia-runner.py" "$smoke/status.txt" || {
            echo "status did not report the runner inside the unpacked tarball ($dir)" >&2
            exit 1
          }
          if [ -e "$data/engine/runners" ]; then
            echo "the binary fell back to its compiled-in runner under $data/engine/runners" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ steps.package.outputs.name }}.tar.gz
            dist/${{ steps.package.outputs.name }}.tar.gz.sha256
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
