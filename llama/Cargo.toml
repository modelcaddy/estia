[package]
name = "estia-llama"
description = "Estia's llama.cpp backend: a runner-protocol adapter in front of upstream llama-server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["llm", "inference", "llama-cpp", "gguf", "local"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "estia-llama"
path = "src/main.rs"

[dependencies]
estia-proto = { path = "../proto", version = "0.1.0" }
serde_json.workspace = true
anyhow.workspace = true
# The API key for llama-server.
getrandom.workspace = true

[target.'cfg(unix)'.dependencies]
# kill(2), signal handlers, and PR_SET_PDEATHSIG on Linux.
libc = "0.2"
