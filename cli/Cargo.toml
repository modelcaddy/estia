[package]
name = "estia"
description = "Estia command-line tool: setup, service, serve, pairing, models, run, chat, embed, bench."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["llm", "inference", "mlx", "openai", "estia"]
categories = ["artificial-intelligence", "command-line-utilities"]

[[bin]]
name = "estia"
path = "src/main.rs"

[dependencies]
estia-engine = { path = "../engine", version = "0.1.0", features = ["python-mlx"] }
estia-server = { path = "../server", version = "0.1.0" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { version = "0.12", features = ["json", "blocking"] }
log = "0.4"
libc = "0.2"
