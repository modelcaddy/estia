[package]
name = "estia"
description = "Estia command-line tool: setup, service, serve, pairing, models, run, chat, embed, bench."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["llm", "inference", "mlx", "openai", "estia"]
categories = ["artificial-intelligence", "command-line-utilities"]

[[bin]]
name = "estia"
path = "src/main.rs"

[dependencies]
# python-mlx and llama-runtime: `estia runtime install` downloads the Python
# MLX runtime or upstream llama.cpp's llama-server.
estia-engine = { path = "../engine", version = "0.1.0", features = ["python-mlx", "llama-runtime"] }
# The llama.cpp adapter, run in-process as `estia runner llama`.
estia-llama = { path = "../llama", version = "0.1.0" }
estia-server = { path = "../server", version = "0.1.0" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { version = "0.12", features = ["json", "blocking"] }
# The subscriber for `serve` and the other commands: text or JSON lines on
# stderr, filtered by --log-level / ESTIA_LOG / RUST_LOG. tracing-log forwards
# records from crates that use `log` (mdns-sd).
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "json", "registry", "smallvec", "std", "tracing-log"] }
libc = "0.2"
